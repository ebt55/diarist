[package]
name = "meet-assist"
description = "meet-assist desktop app (Tauri 2): thin command wrappers over meet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Distinct from the bin name to avoid the Windows PDB clash (rust-lang/cargo#8519).
# Desktop-only, so no staticlib/cdylib (those are for Tauri mobile).
name = "meet_assist_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
meet-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
# protocol-asset: playback streams stored audio through the asset protocol
# (Range requests); the scope is set at runtime from the data root.
# tray-icon: the recording indicator and Record/Stop in the notification area.
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.8"
# Ctrl+Alt+R toggles recording from anywhere (registered from Rust; no JS API used).
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-log = "2.10"
tauri-plugin-shell = "2.5"
# Local wall-clock time for default recording titles (already in the tree via tauri).
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

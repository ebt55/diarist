[package]
name = "meet-assist"
description = "meet-assist desktop app (Tauri 2): thin command wrappers over meet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Distinct from the bin name to avoid the Windows PDB clash (rust-lang/cargo#8519).
# Desktop-only, so no staticlib/cdylib (those are for Tauri mobile).
name = "meet_assist_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
meet-core.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-shell = "2.5"

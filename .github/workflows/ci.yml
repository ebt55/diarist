# Checks every pull request and every push to main: Rust format, clippy and
# tests, the desktop front end (svelte-check, bun tests, Vite build), and
# the eval harness's Python unit tests. No secrets, no GPU, no signing: the
# gated GPU, audio-device and private-data tests are #[ignore]d and show as
# ignored (docs/DEV.md, "Gated tests"). Releases are release.yml's job.
#
# Actions are pinned to commit SHAs of releases at least two weeks old; the
# comment beside each names the release.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts only bloat the cache on a one-shot build.
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (stable, with rustfmt and clippy)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          # Pull requests read the cache main writes; they do not add their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.1"

      - name: Node (Vite runs on Node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Front end
        working-directory: apps/desktop
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run build

      - name: cargo fmt
        shell: bash
        run: cargo fmt --all -- --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --workspace

      - name: The generated TypeScript bindings are committed
        shell: bash
        run: |
          # cargo test rewrites apps/desktop/src/lib/generated from the Rust types.
          if [ -n "$(git status --porcelain -- apps/desktop/src/lib/generated)" ]; then
            git status --short -- apps/desktop/src/lib/generated
            echo "::error::The TypeScript bindings differ from the Rust types: run cargo test and commit apps/desktop/src/lib/generated"
            exit 1
          fi

      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          working-directory: tools/eval
          enable-cache: true
          cache-dependency-glob: tools/eval/uv.lock

      - name: Eval harness unit tests
        working-directory: tools/eval
        shell: bash
        run: |
          uv run --locked python -I test_metrics.py
          uv run --locked python -I test_gapfill.py

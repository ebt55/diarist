# Builds the Windows installer and the updater artifacts for a version tag
# and attaches them to a draft GitHub release. Nothing is published until a
# maintainer reviews the draft and publishes it.
#
# Needs two repository secrets (Settings, Secrets and variables, Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#                                       (generated with `bunx tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if it has none)
# The matching public key is in apps/desktop/src-tauri/tauri.conf.json
# (plugins.updater.pubkey), and plugins.updater.endpoints must name this
# repository instead of the REPLACE_WITH_GITHUB_OWNER/REPLACE_WITH_GITHUB_REPO
# placeholder before the first release.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.1"

      - name: Node (Vite runs on Node)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install front-end dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
        shell: bash

      - name: Build installer and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: "meet-assist ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. The installer is not code-signed yet; SmartScreen asks once."
          releaseDraft: true
          prerelease: false
          # Uploads meet-assist_<version>_x64-setup.exe, its .sig and latest.json
          # (the file the in-app updater reads).
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

# Builds a release on GitHub-hosted runners and has SignPath sign it with the
# SignPath Foundation certificate: first diarist.exe, then the NSIS installer
# that contains the signed exe. Then it computes the updater signature (.sig)
# over the SIGNED installer, attaches the installer and the .sig to a draft
# pre-release and opens a pull request that points updater/latest.json at the
# installer. Every SignPath request waits for the owner's approval in SignPath
# (two per release). Plan and one-time setup:
# docs/plans/14-code-signing-signpath.md.
#
# Manual only: Actions, sign-release, Run workflow, "Use workflow from" main,
# with the tag to create (v0.1.0-beta.3, ...). It refuses any other ref, so
# what SignPath verifies (repository, branch main, commit) is what was built.
#
# How it fits release.yml: this workflow never pushes the tag. The draft
# release targets the commit that was built; publishing the draft creates the
# tag there, and release.yml's guard job then finds the installer on the
# release and builds nothing, as for a release built by hand. Do not push the
# tag before running this workflow: release.yml would build an unsigned
# installer for it, and the guard below would then refuse. If the guard job
# fails with "Could not list releases", nothing was built; run it again.
#
# signing-policy test-signing (SignPath's test certificate, not trusted by
# Windows) builds, signs and checks everything, then keeps the files as a
# workflow artifact: no release, no pull request, so it may also build a
# version that is already released. release-signing does the whole release.
#
# Re-running a failed run may be refused by SignPath (its policy can forbid
# signing re-runs); start a new run instead.
#
# Secrets (Settings, Secrets and variables, Actions):
#   SIGNPATH_API_TOKEN                  API token of the SignPath CI user that submits
#                                       the signing requests
#   SIGNPATH_ORGANIZATION_ID            SignPath organization ID (a GUID, Organization
#                                       settings in SignPath)
#   SIGNPATH_PROJECT_SLUG               SignPath project slug (for example diarist)
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key, as for
#                                       release.yml (the key itself, not a path)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if it has none)
# Also, as for release.yml, "Allow GitHub Actions to create and approve pull
# requests" (Settings, Actions, General) for the updater pull request.
#
# SignPath side (docs/plans/14, section 3): the project with the GitHub.com
# trusted build system linked, origin verification on, allowed branch main;
# signing policies test-signing and release-signing with the owner as
# approver and the CI user as the only submitter; artifact configurations
# diarist-exe and diarist-installer, each taking a "version" parameter.

name: sign-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0-beta.3 (must match tauri.conf.json)"
        required: true
        type: string
      signing-policy:
        description: "SignPath signing policy: test-signing makes no release"
        required: true
        type: choice
        options:
          - test-signing
          - release-signing
        default: test-signing

permissions:
  contents: write
  pull-requests: write
  # SignPath's connector reads the workflow run and downloads the unsigned
  # artifacts with the job's token.
  actions: read

concurrency:
  group: sign-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Refuse anything but a new release from main
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          POLICY: ${{ inputs.signing-policy }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (it was started from ${GITHUB_REF})."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"${TAG}\" is not a version tag such as v0.1.0-beta.3."
            exit 1
          fi
          version="${TAG#v}"
          installer="Diarist_${version}_x64-setup.exe"
          # A test-signing run makes no release, so it may build a version that
          # is already released. A release-signing run must make a new one.
          if [ "$POLICY" = "release-signing" ]; then
            # As in release.yml: a failed listing must not be read as "no release".
            if ! assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                  --jq ".[] | select(.tag_name == \"${TAG}\") | .assets[].name")"; then
              echo "::error::Could not list releases for ${GITHUB_REPOSITORY}; refusing to guess whether ${TAG} already has ${installer}. Run the workflow again."
              exit 1
            fi
            if printf '%s\n' "$assets" | grep -Fxq "$installer"; then
              echo "::error::Release ${TAG} already has ${installer}; this workflow never replaces a published or drafted installer."
              exit 1
            fi
            # The tag normally does not exist yet: publishing the draft creates it.
            # If it does exist, it must already point at the commit being built.
            if ! refs="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}" \
                  --jq ".[] | select(.ref == \"refs/tags/${TAG}\") | .object.type + \" \" + .object.sha")"; then
              echo "::error::Could not look up tag ${TAG}. Run the workflow again."
              exit 1
            fi
            if [ -n "$refs" ]; then
              read -r type sha <<< "$refs"
              if [ "$type" = "tag" ]; then
                sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)"
              fi
              if [ "$sha" != "$GITHUB_SHA" ]; then
                echo "::error::Tag ${TAG} exists and points at ${sha}, not at main's ${GITHUB_SHA}."
                exit 1
              fi
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building ${installer} from ${GITHUB_SHA} for ${TAG}"

  windows:
    needs: guard
    runs-on: windows-latest
    # Two SignPath approvals can each take up to two hours (below); the build
    # and the checks take well under an hour.
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
      POLICY: ${{ inputs.signing-policy }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No build cache: SignPath's origin verification expects the signed files
      # to come from this source and this run alone.

      - name: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.1"

      - name: Node (Vite runs on Node)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install front-end dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Tag matches the app version
        run: |
          version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          if [ "${version}" != "${VERSION}" ]; then
            echo "tag ${TAG} does not match tauri.conf.json version ${version}" >&2
            exit 1
          fi

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Write the Authenticode check
        shell: pwsh
        run: |
          # Used after each SignPath request. release-signing must give a valid,
          # timestamped SignPath Foundation signature; the test certificate is not
          # trusted on the runner, so test-signing only needs an intact signature.
          @'
          param([string]$Path, [string]$Policy)
          $sig = Get-AuthenticodeSignature -FilePath $Path
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "none" }
          "${Path}: status $($sig.Status), signer $subject"
          if (-not $sig.SignerCertificate -or $sig.Status -in @("NotSigned", "HashMismatch", "NotSupportedFileFormat")) {
            throw "${Path} has no intact Authenticode signature ($($sig.Status))"
          }
          if ($Policy -eq "release-signing") {
            if ($sig.Status -ne "Valid") { throw "${Path}: signature status $($sig.Status), expected Valid" }
            if ($subject -notmatch 'CN="?SignPath Foundation') { throw "${Path}: signed by $subject, expected SignPath Foundation" }
            if (-not $sig.TimeStamperCertificate) { throw "${Path}: the signature has no timestamp" }
          }
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\check-authenticode.ps1"

      # ------------------------------------------------ pass 1: diarist.exe

      - name: Build diarist.exe (no installer yet)
        working-directory: apps/desktop
        run: bun run tauri build --ci --no-bundle

      - name: Stage diarist.exe for SignPath
        run: |
          mkdir -p signpath/exe
          cp target/release/diarist.exe signpath/exe/diarist.exe

      - name: Upload the unsigned diarist.exe
        id: exe-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diarist-exe-unsigned
          path: signpath/exe/diarist.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign diarist.exe (waits for approval in SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: diarist-exe
          github-artifact-id: ${{ steps.exe-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.guard.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath/exe-signed

      - name: Check the signed diarist.exe and put it in place
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\check-authenticode.ps1" -Path signpath/exe-signed/diarist.exe -Policy $env:POLICY
          Copy-Item signpath/exe-signed/diarist.exe target/release/diarist.exe -Force

      # ------------------------------------------------ pass 2: the installer

      - name: Bundle the installer around the signed exe
        working-directory: apps/desktop
        # --no-binary-patching keeps the signed exe byte for byte (the patch only
        # matters with several installer types per platform; Diarist ships NSIS
        # only). No updater signature here: it is computed over the signed
        # installer below.
        run: >-
          bun run tauri bundle --ci --bundles nsis --no-sign --no-binary-patching
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check that the installer carries the signed exe
        shell: pwsh
        run: |
          $installer = "target/release/bundle/nsis/Diarist_$($env:VERSION)_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "missing $installer" }
          $out = Join-Path $env:RUNNER_TEMP "installer-contents"
          7z e $installer "-o$out" diarist.exe -r -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not read $installer" }
          $inside = (Get-FileHash -Algorithm SHA256 (Join-Path $out "diarist.exe")).Hash
          $signed = (Get-FileHash -Algorithm SHA256 target/release/diarist.exe).Hash
          if ($inside -ne $signed) { throw "the installer's diarist.exe ($inside) is not the signed one ($signed)" }
          "installer carries the signed diarist.exe ($signed)"
          New-Item -ItemType Directory -Force signpath/installer | Out-Null
          Copy-Item $installer signpath/installer/

      - name: Upload the unsigned installer
        id: installer-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diarist-installer-unsigned
          path: signpath/installer/Diarist_${{ needs.guard.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (waits for approval in SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: diarist-installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.guard.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath/installer-signed

      - name: Check the signed installer
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\check-authenticode.ps1" -Path "signpath/installer-signed/Diarist_$($env:VERSION)_x64-setup.exe" -Policy $env:POLICY

      - name: Keep the test-signed files (test-signing only)
        if: inputs.signing-policy == 'test-signing'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diarist-${{ needs.guard.outputs.version }}-test-signed
          path: |
            signpath/exe-signed/diarist.exe
            signpath/installer-signed/Diarist_${{ needs.guard.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 7

      # ------------------------------------------------ release-signing only

      - name: Keep the symbols (signed exe and PDB)
        if: inputs.signing-policy == 'release-signing'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # A PDB matches only this build. Download it once and archive it
          # (docs/DEV.md, "Release PDB"); its paths are the runner's, not a user folder.
          name: diarist-${{ needs.guard.outputs.version }}-symbols
          path: |
            target/release/diarist.exe
            target/release/diarist.pdb
          if-no-files-found: error
          retention-days: 90

      - name: Updater signature over the signed installer
        if: inputs.signing-policy == 'release-signing'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          installer="../../signpath/installer-signed/Diarist_${VERSION}_x64-setup.exe"
          # --app-version binds the signature to the version, as `tauri build` does.
          bun run tauri signer sign --app-version "$VERSION" "$installer"
          test -s "${installer}.sig"

      - name: Check the updater signature against plugins.updater.pubkey
        if: inputs.signing-policy == 'release-signing'
        run: |
          # The check every installed copy makes before it runs an update, done
          # here first: minisign over the BLAKE2b-512 of the file, then the
          # trusted comment, which must carry this version.
          installer="signpath/installer-signed/Diarist_${VERSION}_x64-setup.exe"
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const [file, sigPath, confPath, version] = process.argv.slice(1);
            const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
            const lines = (b64) => Buffer.from(b64.trim(), "base64").toString("utf8").trim().split("\n");
            const pk = Buffer.from(lines(JSON.parse(fs.readFileSync(confPath, "utf8")).plugins.updater.pubkey)[1], "base64");
            const [, sigB64, trustedLine, globalB64] = lines(fs.readFileSync(sigPath, "utf8"));
            const sig = Buffer.from(sigB64, "base64");
            const trusted = trustedLine.replace(/^trusted comment: /, "");
            const key = crypto.createPublicKey({
              key: Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), pk.subarray(10)]),
              format: "der",
              type: "spki",
            });
            if (sig.subarray(0, 2).toString() !== "ED") fail("not a prehashed minisign signature");
            if (!sig.subarray(2, 10).equals(pk.subarray(2, 10))) fail("signed with a different key than plugins.updater.pubkey");
            const digest = crypto.createHash("blake2b512").update(fs.readFileSync(file)).digest();
            if (!crypto.verify(null, digest, key, sig.subarray(10))) fail("signature does not match the file");
            if (!crypto.verify(null, Buffer.concat([sig.subarray(10), Buffer.from(trusted)]), key, Buffer.from(globalB64, "base64"))) fail("trusted comment does not verify");
            if (!trusted.split("\t").includes(`version:${version}`)) fail(`signature is not bound to version ${version}: ${trusted}`);
            console.log(`updater signature verifies against plugins.updater.pubkey: ${trusted}`);
          ' "$installer" "${installer}.sig" apps/desktop/src-tauri/tauri.conf.json "$VERSION"

      - name: Attach the signed installer and its .sig to a draft pre-release
        if: inputs.signing-policy == 'release-signing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          installer="signpath/installer-signed/Diarist_${VERSION}_x64-setup.exe"
          sha256="$(sha256sum "$installer" | cut -d' ' -f1)"
          size="$(wc -c < "$installer" | tr -d ' ')"
          {
            echo "See CHANGELOG.md."
            echo
            echo "The installer and diarist.exe are signed; Windows shows the publisher as SignPath Foundation. Free code signing provided by SignPath.io, certificate by SignPath Foundation. Code signing policy: https://diarist.dev/code-signing/"
            echo
            echo "Diarist_${VERSION}_x64-setup.exe: ${size} bytes, SHA-256 ${sha256}"
          } > "$RUNNER_TEMP/notes.md"
          # The draft targets the built commit; the tag is created there only
          # when the draft is published.
          gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Diarist ${TAG}" --notes-file "$RUNNER_TEMP/notes.md" \
            "$installer" "${installer}.sig"
          echo "::notice::Draft ${TAG}: ${size} bytes, SHA-256 ${sha256}"

      - name: Write updater/latest.json
        if: inputs.signing-policy == 'release-signing'
        env:
          REPO: ${{ github.repository }}
        run: |
          sig="signpath/installer-signed/Diarist_${VERSION}_x64-setup.exe.sig"
          test -s "$sig"
          node -e '
            const fs = require("fs");
            const [version, tag, repo, sigPath] = process.argv.slice(1);
            const manifest = {
              version,
              notes: `Diarist ${version}: see CHANGELOG.md`,
              pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(sigPath, "utf8").trim(),
                  url: `https://github.com/${repo}/releases/download/${tag}/Diarist_${version}_x64-setup.exe`,
                },
              },
            };
            fs.writeFileSync("updater/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$TAG" "$REPO" "$sig"
          cat updater/latest.json

      - name: Open a pull request for updater/latest.json
        if: inputs.signing-policy == 'release-signing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="updater/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add updater/latest.json
          git commit -m "updater: latest.json for ${TAG}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "updater: offer ${TAG}" \
            --body "Points installed copies at ${TAG} (signed by SignPath Foundation). Merge only after the draft release ${TAG} is published, so the installer URL in updater/latest.json answers."

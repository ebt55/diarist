[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/meet-cli",
    # BLOCKED: "apps/desktop/src-tauri" is parked outside the workspace because
    # Tauri 2.12.x (tauri, tauri-build 2.7, tauri-runtime(-wry) 2.12, tauri-utils 2.10,
    # muda 0.20, plugins shell 2.5 / dialog 2.8 / log 2.10 / fs 2.7) declares
    # rust-version 1.90 and the dev toolchain is 1.88. Re-add it here once the
    # toolchain is >= 1.90, or after pinning Tauri to 2.11.x. See docs/DEV.md.
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Pinned to the toolchain on the dev machine. `.cargo/config.toml` makes the
# resolver prefer dependency versions that support this rust-version.
rust-version = "1.88"
license = "MIT"
authors = ["meet-assist contributors"]
publish = false

[workspace.dependencies]
meet-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
ulid = "3"
clap = { version = "4", features = ["derive"] }

[profile.release]
# Size settings from https://tauri.app/concept/size/ minus `panic = "abort"`:
# a panicking command should not take the whole app (and a live recording) down.
codegen-units = 1
lto = true
strip = true

[workspace]
resolver = "2"
members = ["crates/core", "crates/meet-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust: Tauri 2.12 needs 1.90. `.cargo/config.toml` makes the
# resolver prefer dependency versions that support this rust-version.
rust-version = "1.90"
license = "MIT"
authors = ["meet-assist contributors"]
publish = false

[workspace.dependencies]
meet-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
ulid = "3"
clap = { version = "4", features = ["derive"] }

[profile.release]
# Size settings from https://tauri.app/concept/size/ minus `panic = "abort"`:
# a panicking command should not take the whole app (and a live recording) down.
codegen-units = 1
lto = true
strip = true

language = "en"

# --- Punctuation (0.1.0-beta.5, docs/plans/16 section 3.5) ---
# Every data root runs with `transcript.punctuation = off` unless its config
# says `punctuation = true`: run.py writes the setting into the config's data
# root and keeps the key in the cache key, so the accuracy tables keep
# measuring the speech model and the diarizer. A `punctuation = true` config
# selects the manifest's required punctuation model (or `punctuation_model`),
# which must be in the models folder. Punctuation never changes words, times
# or speakers, so cpWER, tcpWER and WDER equal shipped_en's; DER, JER and
# ORC-WER move, because segments now end at sentence ends
# (docs/eval/2026-10-26-punctuation.md section 12).

[shipped_en_punct]
description = "Nemotron EN, the app's own defaults, with punctuation on (transcript.punctuation = auto, the manifest's punctuation model)"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
punctuation = true

# --- Repeated-token loop collapse (0.1.0-beta.5, docs/plans/16 section 12.3) ---
# Every data root runs with `transcript.collapse_loops` at the app's default
# (on): run.py writes the setting into the config's data root and keeps it in
# the cache key (a run cached before the collapse existed counts as off, so
# it is transcribed again). `collapse_loops = false` turns it off for one
# config, for comparisons with the tables before beta.5
# (docs/eval/2026-10-26-loop-collapse.md).

[shipped_en_loops_off]
description = "Nemotron EN, the app's own defaults, with the repeated-token loop collapse off (transcript.collapse_loops = off, as before 0.1.0-beta.5)"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
collapse_loops = false

# --- Gap fill, measured from cached runs (0.1.0-beta.6 chunk N1, docs/plans/18 section 3.3) ---
# `replay` configs never transcribe (run.py refuses them without --metrics-only).
# `gapfill.py run --config <c> --source en=<runs of the EN file pass> --source
# n35=<runs of the 3.5 file pass>` writes each session's words JSON from the
# cached runtime words of the `replay` model (with the second model's words in
# its stretches of at least `g_s` seconds when `gap_fill` is set), imports it
# through the app's file import (loop collapse and punctuation at the app's
# defaults) and exports it; `run.py --config <c> --metrics-only` scores it.
# `replay` and `gap_fill` are in the cache key. The fill rule and the points
# the plan leaves open are in gapfill.py's docstring.

[en_replay]
description = "Nemotron EN's cached file-pass words replayed through the file import with the beta.5 defaults (loop collapse on, punctuation auto): EN alone, the gap fill's comparison"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
punctuation = true
replay = "en"

[n35_replay]
description = "Nemotron 3.5's cached file-pass words replayed through the file import with the beta.5 defaults: 3.5 alone"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
punctuation = true
replay = "n35"

[en_fill_n35_g10]
description = "Nemotron EN primary, its stretches of 1.0 s or more without a word filled with Nemotron 3.5's words (plan 18 section 3.3), replayed through the file import"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
punctuation = true
replay = "en"
gap_fill = { fill = "n35", g_s = 1.0 }

[en_fill_n35_g15]

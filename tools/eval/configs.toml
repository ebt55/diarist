# Eval configurations for run.py. Each runs `diarist-cli transcribe --rttm` with
# its own scratch data root (.work/data/<config>), because the ASR model is a
# selection stored in that root's database (`diarist-cli models select asr`).
#
# asr / diarizer: manifest names from manifests/models.json.
# language: passed as `transcribe --language` (`auto` lets Nemotron 3.5 detect).
# engine_args: flags appended verbatim to `nemo-speech transcribe`, one list
#   item per argument (run.py passes each as `--engine-arg=<item>`). They reach
#   the transcribe step only, not the standalone `diarize` pass of `--rttm`.
# skip: the config is listed but not runnable; run.py prints the reason.
#
# Decoder lookahead (`--asr.streaming.rnnt_right_context R`): the encoder sees
# R 80 ms frames ahead, so a chunk is (R + 1) x 80 ms: 0 = 80 ms, 1 = 160 ms
# (runtime default), 3 = 320 ms, 6 = 560 ms, 13 = 1.12 s. `-1` is the GGUF's
# trained maximum: 13 for Nemotron EN, but 3 for the pinned Nemotron 3.5 GGUF
# (its header says train_right_ctx 3), so 1.12 s on 3.5 needs an explicit 13.
# Diarizer context (`--diar-rc`, `--diar-lc`, `--diar-chunk`, 80 ms frames):
# Nemotron 3 Diarization defaults to chunk 13, right context 1.

[nemotron35]
description = "Default: Nemotron 3.5 streaming ASR + Nemotron 3 Diarization (v3-streaming preset), language en"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"

[nemotron_en]
description = "Fallback ASR: Nemotron EN streaming + Nemotron 3 Diarization, language en"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"

[nemotron35_verbatim]
description = "Nemotron 3.5 with the runtime's --verbatim flag, which in nemo-speech 0.2.0 disables inverse text normalisation (ITN), not filler removal; with no ITN grammars configured it should change nothing"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--verbatim"]

# --- Decoder lookahead for file jobs (plan 12, measurement 1) ---
# Explicit values per model. The two `_max` configs pass -1 and exist to show
# what -1 resolves to (identical output to en_rc_13 and n35_rc_3).

[en_rc_13]
description = "Nemotron EN, rnnt_right_context 13 (1.12 s, the model's trained maximum)"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "13"]

[n35_rc_3]
description = "Nemotron 3.5, rnnt_right_context 3 (320 ms, the pinned GGUF's train_right_ctx)"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "3"]

[en_rc_max]
description = "Nemotron EN, rnnt_right_context -1 (resolves to the trained maximum, 13 = 1.12 s; identity check for en_rc_13)"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "-1"]

[n35_rc_max]
description = "Nemotron 3.5, rnnt_right_context -1 (resolves to the pinned GGUF's train_right_ctx, 3 = 320 ms; identity check for n35_rc_3)"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "-1"]

# n35_rc_6 also names the diarizer preset since beta.5: plan 12 ran it before
# the manifest's file_preset existed, so the runtime default (v3-streaming)
# applied; a rebuilt diarist-cli would otherwise pass v3-offline. It is one of
# the live lookahead configs below.
[n35_rc_6]
description = "Nemotron 3.5, rnnt_right_context 6 (560 ms), diarizer preset v3-streaming (as live)"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "6", "--asr.diar.preset", "v3-streaming"]

[n35_rc_13]
description = "Nemotron 3.5, rnnt_right_context 13 (1.12 s, the model card's largest setting)"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "13"]

# --- Live lookahead (0.1.0-beta.5, docs/plans/16 section 5) ---
# The live server's setting on the file path: the same cache-aware decoder at
# lookahead R, the diarizer on the live geometry (v3-streaming), both passed
# explicitly because a rebuilt diarist-cli otherwise applies the manifest's
# file_right_context 13 and file_preset v3-offline. R 1 is what live runs
# today (the runtime default), R 6 the candidate; n35_rc_6 is above.

[en_rc_1]
description = "Nemotron EN, rnnt_right_context 1 (160 ms, the live default), diarizer preset v3-streaming (as live)"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "1", "--asr.diar.preset", "v3-streaming"]

[n35_rc_1]
description = "Nemotron 3.5, rnnt_right_context 1 (160 ms, the live default), diarizer preset v3-streaming (as live)"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "1", "--asr.diar.preset", "v3-streaming"]

[en_rc_6]
description = "Nemotron EN, rnnt_right_context 6 (560 ms, the live candidate), diarizer preset v3-streaming (as live)"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "6", "--asr.diar.preset", "v3-streaming"]

# --- Diarizer geometry in the fused pass (plan 12, measurement 2) ---
# `--asr.diar.preset v3-offline` is still AOSC streaming, with the runtime's
# offline geometry (src/asr/diar/aosc_state.h, 0.2.0): speaker cache 264,
# FIFO 0, chunk 264 frames (21.1 s), cache update period 188, left and right
# context 1, against v3-streaming's 264 / 80 / 13 (1.04 s) / 40 / 0 / 1. Not
# the stateless `diarize --offline` pass that scored worse in research/03.

[n35_rc_13_diar_off]
description = "Nemotron 3.5, lookahead 13 (1.12 s), diarizer preset v3-offline in the fused pass"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "13", "--asr.diar.preset", "v3-offline"]

[en_rc_13_diar_off]
description = "Nemotron EN, lookahead 13 (1.12 s), diarizer preset v3-offline in the fused pass"
asr = "nemotron-en"
diarizer = "nemotron-3-diarization"
language = "en"
engine_args = ["--asr.streaming.rnnt_right_context", "13", "--asr.diar.preset", "v3-offline"]

# --- The shipped configuration (0.1.0-beta.2) ---
# No engine_args: diarist-cli passes what the app passes (the manifest's
# file_right_context and file_preset, read by the scan of a fresh data root).
# With a 0.1.0-beta.2 build these must match n35_rc_13_diar_off and
# en_rc_13_diar_off word for word and tag for tag (`levers.py diff`).

[shipped_n35]
description = "Nemotron 3.5, the app's own defaults, nothing passed"
asr = "nemotron-3.5"
diarizer = "nemotron-3-diarization"
language = "en"

[shipped_en]
description = "Nemotron EN, the app's own defaults, nothing passed"

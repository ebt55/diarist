# --- Phase control and input gain on runtime 0.2.0 (0.1.0-beta.6 chunk N2, docs/plans/18 section 3.5) ---
# `audio_shift_ms`: run.py prepares a copy of the 16 kHz WAV (.work/wav/<session>.shift<n>ms.wav),
# positive = that much leading digital silence, negative = that much trimmed from the start, and
# moves the hypothesis times back by the same amount before scoring, so gaps and the scored region
# are read on the unmodified audio's timeline. `audio_peak_dbfs`: the copy is scaled so that its
# largest sample over the whole file sits at that level. Both are in the cache key and run.json.
# Loop collapse off and punctuation off, as in the cached v0.2.0 runs these are read against
# (research/19's rs_*_shipped, made by a 0.1.0-beta.4 build, which had no collapse).


# Prefer dependency versions whose declared rust-version is compatible with the
# workspace `rust-version` (Cargo 1.84+). Without this, `cargo update` happily
# picks releases that need a newer compiler than the one we build with.
[resolver]
incompatible-rust-versions = "fallback"

# ts-rs: `cargo test -p meet-core` writes the TypeScript bindings for
# `meet_core::views` and the domain types into the desktop frontend. Ids and
# timestamps are i64 in Rust but always below 2^53, so they map to `number`.
[env]
TS_RS_EXPORT_DIR = { value = "apps/desktop/src/lib/generated", relative = true }
TS_RS_LARGE_INT = "number"

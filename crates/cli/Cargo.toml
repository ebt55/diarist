[package]
name = "diarist-cli"
description = "Diarist dev CLI: transcribe a file, dump JSON, run the post-pass (no UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "diarist-cli"
path = "src/main.rs"

[dependencies]
diarist-core.workspace = true
clap.workspace = true
serde_json.workspace = true
# Ctrl-C stops `diarist-cli record` cleanly (post-pass included).
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
# `aec-probe` (hidden dev subcommand, src/aec_probe.rs): stream category,
# AEC reference and audio effects on a raw WASAPI client, which the core's
# capture does not expose. `windows` 0.62 is the version wasapi 0.26 is built
# on (its COM types cross the API); diarist-core's own `windows` stays 0.61.
wasapi = "0.26"
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
rustfft = "6"
hound = "3.5"

[dev-dependencies]
hound = "3.5"
tempfile = "3"

[package]
name = "diarist-core"
description = "Diarist core: domain types, engine protocol, store, audio decode, engine adapters, models, transcript, export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "diarist_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
ts-rs.workspace = true
# Logging facade; the desktop app's logger writes the records to diarist.log.
log = "0.4"
# SQLite with FTS5 compiled in (bundled build); backup API for `SqliteStore::backup`.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
# File decode (docs/01 "Audio decode"): AAC-LC in MP4/M4A, MP3, FLAC, WAV, Ogg/Vorbis.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "wav", "ogg", "vorbis", "pcm"] }
# Pinned to 5.x: the resampler API changes with every major release.
rubato = "5.0"
# FFT cross-correlation of the echo monitor and word gate (audio::echo);
# already in the tree through rubato, same version.
realfft = "3.5"
hound = "3.5"
# Engine zip download: rustls with the platform verifier (Windows cert store, system proxy).
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Live capture (Phase 3): lock-free rings between the capture threads and the
# per-channel pipelines.
rtrb = "0.3"
# Live engine adapter: `nemo-speech serve` realtime WebSocket.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Stereo playback track after the post-pass (docs/research/06 B). Pinned to 1.x.
flac-codec = { version = "1", default-features = false }
# Free VRAM for the live start gate (docs/01 "Capture robustness"): loads the
# driver's nvml.dll at run time; `nemo-speech doctor` is the fallback.
nvml-wrapper = "0.13"
# Punctuation (docs/plans/16 section 3.7): ONNX Runtime on the CPU, loaded at
# run time by absolute path from the model's folder (`load-dynamic`; no
# build-time download, no copied DLL). `api-31` is named because without the
# default features the API baseline falls to 17, and Windows' own 1.17 copy
# in System32 would then load instead of failing.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
# The punctuation model's `tokenizer.json` (token ids and offsets per word).
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[target.'cfg(windows)'.dependencies]
# Diagnostics_Debug, Kernel, Memory, ProcessStatus, Threading: the native
# crash filter and its minidump (crash.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    # The punctuation runtime's module identity check (punct/onnx.rs).
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# WASAPI mic and render-endpoint loopback capture (docs/01 "Audio capture").
# Pinned to 0.26.x.
wasapi = "0.26"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[features]
# Binary stdin framing for an optional FFI sidecar (docs/03 appendix).
ffi-wire = []
